# Fly.io — https://fly.io/docs/reference/configuration/
#
#   fly launch --no-deploy --copy-config     # claims the app name
#   fly volumes create texasarng_data --size 1 --region dfw
#   fly secrets set JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))")"
#   fly deploy
#   fly certs add texasarng.com              # then add the DNS records it prints
#
# Change `app` to whatever name you claimed. dfw = Dallas, closest to Texas.

app = "texasarng"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV   = "production"
  PORT       = "8080"
  DATA_DIR   = "/data"
  DB_FILE    = "/data/texasarng.db"
  UPLOAD_DIR = "/data/uploads"

[[mounts]]
  source      = "texasarng_data"
  destination = "/data"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  # SQLite writes to a single volume that only one machine can mount, so this
  # must stay at 1. Scaling out requires moving to Postgres first.
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout  = "5s"
  method   = "GET"
  path     = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
