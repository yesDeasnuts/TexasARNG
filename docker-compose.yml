# Self-hosting on a VPS (Hetzner, DigitalOcean, a home server…).
# Caddy terminates TLS and gets a free Let's Encrypt certificate automatically —
# just point your domain's A record at the server and run `docker compose up -d`.
#
#   cp .env.example .env      # then set DOMAIN, ACME_EMAIL and JWT_SECRET
#   docker compose up -d

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data
      DB_FILE: /data/texasarng.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
    volumes:
      - data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly SQLite backup, 14 days retained. Uses the online backup API so it is
  # safe to run while the app is writing.
  backup:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         sleep 86400;
         node server/scripts/backup.js || echo "backup failed";
       done'
    environment:
      DATA_DIR: /data
      DB_FILE: /data/texasarng.db
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: "14"
    volumes:
      - data:/data

volumes:
  data:
  caddy_data:
  caddy_config:
