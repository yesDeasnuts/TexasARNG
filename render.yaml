# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → connect this GitHub repo. Render reads this file
# and creates the service. Then add your domain under Settings → Custom Domains.
#
# NOTE: the free plan has NO persistent disk — the database and uploaded images
# are wiped on every deploy and whenever the service sleeps. Fine for kicking the
# tyres, not for a live community. The `disk:` block below requires the Starter
# plan ($7/mo); delete it if you are only testing on free.

services:
  - type: web
    name: texasarng
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true

    disk:
      name: texasarng-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      # Render generates a strong value and keeps it stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 12h
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: DB_FILE
        value: /data/texasarng.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      # Set this to your domain once DNS is live, e.g. https://texasarng.com
      - key: CORS_ORIGIN
        sync: false
